# Site settings:
#   Build command:     (leave empty - there is nothing to build)
#   Publish directory: public
#
# edge_functions is the folder Netlify looks in for edge functions. Two
# rules, and breaking either one is silent:
#
#   1. it is resolved relative to the site's BASE DIRECTORY
#   2. it must NOT contain the publish directory
#
# Setting it to "." breaks rule 2, because "." contains public/. Netlify
# then registers no function at all, the site still deploys happily, and
# /api/students falls through to the static 404 page with no error
# anywhere. Hence a folder of its own.

[build]
  publish = "public"
  edge_functions = "edge-functions"
